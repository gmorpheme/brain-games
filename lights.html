<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lights Out</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            border: 2px solid #00ff00;
            padding: 30px;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff00;
            letter-spacing: 3px;
        }

        .game-area {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
        }

        .board-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #board {
            display: grid;
            gap: 8px;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1;
        }

        .cell {
            background: #0a0a0a;
            border: 2px solid #004400;
            cursor: pointer;
            padding: 0;
            transition: all 0.15s;
        }

        .cell:hover {
            border-color: #00ff00;
        }

        .cell.lit {
            background: #00cc00;
            border-color: #00ff00;
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.6);
        }

        #resultMessage {
            text-align: center;
            font-size: 2.5em;
            margin-top: 30px;
            height: 80px;
            line-height: 80px;
            text-shadow: 0 0 30px #00ff00;
            font-weight: bold;
            letter-spacing: 8px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
        }

        .success {
            color: #00ff00;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .info-panel {
            flex: 0 0 300px;
            border: 2px solid #00ff00;
            padding: 20px;
            background: #0a0a0a;
        }

        .info-item {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #004400;
        }

        .info-label {
            font-size: 0.9em;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.8em;
            font-weight: bold;
            text-shadow: 0 0 5px #00ff00;
        }

        .best-score {
            font-size: 0.8em;
            opacity: 0.7;
            margin-top: 5px;
            min-height: 1.2em;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .controls button {
            background: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 15px 25px;
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .controls button:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 15px #00ff00;
        }

        .start-button {
            font-size: 1.5em;
            padding: 20px;
            font-weight: bold;
        }

        .settings {
            border: 2px solid #00ff00;
            padding: 20px;
            margin-top: 20px;
        }

        .settings h2 {
            margin-bottom: 15px;
            font-size: 1.3em;
            text-shadow: 0 0 5px #00ff00;
        }

        .setting-item {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-item label {
            flex: 1;
        }

        input[type="range"] {
            flex: 1;
            accent-color: #00ff00;
        }

        .grid-size-value {
            display: inline-block;
            min-width: 30px;
            text-align: right;
        }

        @media (max-width: 800px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.6em;
                letter-spacing: 1px;
                margin-bottom: 20px;
            }

            .game-area {
                flex-direction: column;
                gap: 25px;
            }

            .info-panel {
                flex: none;
                display: flex;
                flex-direction: column;
            }

            .controls {
                order: -1;
                margin-bottom: 20px;
            }

            #resultMessage {
                font-size: 1.6em;
                height: 50px;
                line-height: 50px;
                letter-spacing: 3px;
                margin-top: 15px;
            }

            .controls button {
                min-height: 44px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>◢ LIGHTS OUT ◣</h1>

        <div class="game-area">
            <div class="board-container">
                <div id="board"></div>
                <div id="resultMessage"></div>
            </div>

            <div class="info-panel">
                <div class="info-item">
                    <div class="info-label">MOVES</div>
                    <div class="info-value" id="moves">0</div>
                </div>

                <div class="info-item">
                    <div class="info-label">PAR</div>
                    <div class="info-value" id="par">0</div>
                </div>

                <div class="info-item">
                    <div class="info-label">BEST SCORE</div>
                    <div class="info-value" id="bestScore">--</div>
                    <div class="best-score" id="bestScoreDetail"></div>
                </div>

                <div class="controls">
                    <button class="start-button" id="newGameButton">NEW GAME</button>
                    <button id="clearScoresButton">CLEAR SCORES</button>
                </div>
            </div>
        </div>

        <div class="settings">
            <h2>▸ SETTINGS</h2>

            <div class="setting-item">
                <label for="gridSize">
                    Grid size: <span class="grid-size-value" id="gridSizeDisplay">5</span>
                </label>
                <input type="range" id="gridSize" min="3" max="7" value="5" step="1">
            </div>
        </div>
    </div>

    <script>
        const board = document.getElementById('board');

        // Game state
        let gridSize = 5;
        let cells = [];
        let moves = 0;
        let par = 0;
        let gameWon = false;
        let bestScores = {};

        // UI elements
        const movesDisplay = document.getElementById('moves');
        const parDisplay = document.getElementById('par');
        const bestScoreDisplay = document.getElementById('bestScore');
        const bestScoreDetailDisplay = document.getElementById('bestScoreDetail');
        const resultMessage = document.getElementById('resultMessage');
        const newGameButton = document.getElementById('newGameButton');
        const clearScoresButton = document.getElementById('clearScoresButton');
        const gridSizeSlider = document.getElementById('gridSize');
        const gridSizeDisplay = document.getElementById('gridSizeDisplay');

        // Toggle a cell and its four orthogonal neighbours
        function applyPress(index) {
            const row = Math.floor(index / gridSize);
            const col = index % gridSize;
            const toggle = (r, c) => {
                if (r >= 0 && r < gridSize && c >= 0 && c < gridSize) {
                    cells[r * gridSize + c] = !cells[r * gridSize + c];
                }
            };
            toggle(row, col);
            toggle(row - 1, col);
            toggle(row + 1, col);
            toggle(row, col - 1);
            toggle(row, col + 1);
        }

        // Scramble by pressing K distinct random cells (always solvable)
        function scramble() {
            const total = gridSize * gridSize;
            par = Math.ceil(total / 2);
            do {
                cells = new Array(total).fill(false);
                const indices = [...Array(total).keys()];
                for (let i = 0; i < par; i++) {
                    const j = i + Math.floor(Math.random() * (indices.length - i));
                    [indices[i], indices[j]] = [indices[j], indices[i]];
                    applyPress(indices[i]);
                }
            } while (cells.every(c => !c));
        }

        // Rebuild the board's DOM for the current grid size
        function buildBoard() {
            board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            for (let i = 0; i < gridSize * gridSize; i++) {
                const cell = document.createElement('button');
                cell.className = 'cell';
                cell.addEventListener('click', () => cellPressed(i));
                board.appendChild(cell);
            }
        }

        // Sync cell elements with state
        function render() {
            for (let i = 0; i < cells.length; i++) {
                board.children[i].classList.toggle('lit', cells[i]);
            }
        }

        function cellPressed(index) {
            if (gameWon) return;
            applyPress(index);
            moves++;
            render();
            updateDisplay();
            checkWin();
        }

        function checkWin() {
            if (cells.every(c => !c)) {
                gameWon = true;
                const isNewBest = saveBestScore();
                resultMessage.textContent = isNewBest ? '✓ NEW BEST!' : '✓ SOLVED!';
                resultMessage.className = 'success';
                updateDisplay();
            }
        }

        function initGame() {
            scramble();
            moves = 0;
            gameWon = false;
            resultMessage.textContent = '';
            resultMessage.className = '';
            buildBoard();
            render();
            updateDisplay();
        }

        function loadSettings() {
            const saved = localStorage.getItem('lightsOutSettings');
            if (saved) {
                try {
                    const settings = JSON.parse(saved);
                    gridSize = settings.gridSize || 5;
                } catch (e) {
                    gridSize = 5;
                }
                gridSizeSlider.value = gridSize;
                gridSizeDisplay.textContent = gridSize;
            }

            const savedScores = localStorage.getItem('lightsOutBestScores');
            if (savedScores) {
                try {
                    bestScores = JSON.parse(savedScores);
                } catch (e) {
                    bestScores = {};
                }
            }
        }

        function saveSettings() {
            const settings = { gridSize };
            localStorage.setItem('lightsOutSettings', JSON.stringify(settings));
        }

        function saveBestScore() {
            const currentBest = bestScores[gridSize];
            if (!currentBest || moves < currentBest) {
                bestScores[gridSize] = moves;
                localStorage.setItem('lightsOutBestScores', JSON.stringify(bestScores));
                return true;
            }
            return false;
        }

        function updateDisplay() {
            movesDisplay.textContent = moves;
            parDisplay.textContent = par;

            const bestScore = bestScores[gridSize];
            if (bestScore !== undefined) {
                bestScoreDisplay.textContent = bestScore;
                const bestDiff = bestScore - par;
                bestScoreDetailDisplay.textContent = bestDiff <= 0 ? 'AT OR UNDER PAR!' : `(par +${bestDiff})`;
            } else {
                bestScoreDisplay.textContent = '--';
                bestScoreDetailDisplay.textContent = '';
            }
        }

        // Button handlers
        newGameButton.addEventListener('click', () => {
            initGame();
        });

        clearScoresButton.addEventListener('click', () => {
            if (confirm('Clear all best scores?')) {
                bestScores = {};
                localStorage.removeItem('lightsOutBestScores');
                updateDisplay();
            }
        });

        gridSizeSlider.addEventListener('input', (e) => {
            gridSize = parseInt(e.target.value);
            gridSizeDisplay.textContent = gridSize;
            saveSettings();
            initGame();
        });

        // Initialize
        loadSettings();
        initGame();
    </script>
</body>
</html>
